<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Geneva Diplomatic Assembly over Lake Geneva at twilight">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060c1f"/>
      <stop offset="48%" stop-color="#0f2347"/>
      <stop offset="78%" stop-color="#2c446e"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172b4d"/>
      <stop offset="40%" stop-color="#0a162b"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <radialGradient id="glowHall" cx="50%" cy="62%" r="38%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="42%" stop-color="#f59e0b" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waterRefl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.52"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="440" fill="url(#sky)"/>
  <!-- Distant Alpine peaks -->
  <path d="M0 370 L110 295 L195 335 L310 245 L430 325 L545 268 L675 330 L815 235 L950 310 L1085 258 L1200 320 L1200 440 L0 440 Z" fill="#0c1a36" opacity="0.85"/>
  <path d="M0 390 L160 330 L280 365 L410 302 L560 360 L720 292 L890 355 L1040 315 L1200 365 L1200 440 L0 440 Z" fill="#13264a" opacity="0.92"/>
  <!-- Maritime & Global Route Arcs in Twilight Sky -->
  <g stroke="#38bdf8" fill="none" stroke-opacity="0.28" stroke-width="1.2">
    <path d="M120 420 Q420 100 1080 390" stroke-dasharray="6 8"/>
    <path d="M220 420 Q600 130 980 410" stroke-dasharray="4 6" stroke="#fbbf24" stroke-opacity="0.35"/>
    <circle cx="600" cy="240" r="195" stroke-opacity="0.12"/>
    <circle cx="600" cy="240" r="265" stroke-opacity="0.08"/>
  </g>
  <!-- Stars -->
  <g fill="#e2e8f0" opacity="0.65">
    <circle cx="140" cy="74" r="1.4"/><circle cx="290" cy="112" r="1.2"/><circle cx="430" cy="64" r="1.8"/>
    <circle cx="740" cy="82" r="1.5"/><circle cx="880" cy="52" r="1.3"/><circle cx="1040" cy="96" r="1.6"/>
    <circle cx="620" cy="48" r="1.2"/><circle cx="960" cy="135" r="1.1"/><circle cx="215" cy="158" r="1.1"/>
  </g>
  <!-- Ambient warm halo behind assembly hall -->
  <ellipse cx="600" cy="390" rx="340" ry="125" fill="url(#glowHall)" filter="url(#softBlur)"/>
  <!-- Architectural Glass Diplomatic Assembly Hall -->
  <g transform="translate(260, 275)">
    <!-- Sweeping cantilevered roof -->
    <path d="M-24 44 L340 4 L704 44 L676 58 L340 24 L4 58 Z" fill="#e2e8f0" opacity="0.9"/>
    <path d="M0 54 L680 54 L665 152 L15 152 Z" fill="url(#glassWall)"/>
    <!-- Interior architectural columns -->
    <g stroke="#0f172a" stroke-width="3.5" opacity="0.65">
      <line x1="65" y1="54" x2="65" y2="152"/><line x1="130" y1="54" x2="130" y2="152"/>
      <line x1="195" y1="54" x2="195" y2="152"/><line x1="260" y1="54" x2="260" y2="152"/>
      <line x1="340" y1="36" x2="340" y2="152"/><line x1="420" y1="54" x2="420" y2="152"/>
      <line x1="485" y1="54" x2="485" y2="152"/><line x1="550" y1="54" x2="550" y2="152"/>
      <line x1="615" y1="54" x2="615" y2="152"/>
    </g>
    <!-- Horizontal mezzanine deck -->
    <rect x="18" y="102" width="644" height="7" fill="#0f172a" opacity="0.72"/>
    <!-- Subtle silhouettes of delegates -->
    <g fill="#1e293b" opacity="0.72">
      <circle cx="156" cy="128" r="5"/><rect x="151" y="133" width="10" height="19" rx="3"/>
      <circle cx="174" cy="129" r="4.8"/><rect x="169" y="134" width="10" height="18" rx="3"/>
      <circle cx="315" cy="127" r="5.2"/><rect x="310" y="132" width="11" height="20" rx="3"/>
      <circle cx="362" cy="128" r="5"/><rect x="357" y="133" width="10" height="19" rx="3"/>
      <circle cx="508" cy="129" r="5"/><rect x="503" y="134" width="10" height="18" rx="3"/>
    </g>
    <!-- Waterfront stone promenade -->
    <rect x="-55" y="152" width="790" height="14" fill="#0b1325"/>
  </g>
  <!-- Lake Geneva water & shimmering golden reflections -->
  <rect y="438" width="1200" height="237" fill="url(#lake)"/>
  <path d="M275 440 L925 440 L980 675 L220 675 Z" fill="url(#waterRefl)"/>
  <g stroke="#fde68a" stroke-linecap="round" opacity="0.45">
    <line x1="340" y1="458" x2="860" y2="458" stroke-width="2.5"/>
    <line x1="380" y1="478" x2="820" y2="478" stroke-width="2"/>
    <line x1="310" y1="504" x2="640" y2="504" stroke-width="1.6"/>
    <line x1="680" y1="504" x2="890" y2="504" stroke-width="1.6"/>
    <line x1="410" y1="536" x2="790" y2="536" stroke-width="1.4" opacity="0.5"/>
    <line x1="460" y1="572" x2="740" y2="572" stroke-width="1.2" opacity="0.35"/>
    <line x1="510" y1="612" x2="690" y2="612" stroke-width="1" opacity="0.25"/>
  </g>
  <!-- Glowing global corridor nodes -->
  <g>
    <circle cx="290" cy="236" r="4" fill="#38bdf8"/><circle cx="290" cy="236" r="11" fill="#38bdf8" opacity="0.2"/>
    <circle cx="600" cy="158" r="5" fill="#fbbf24"/><circle cx="600" cy="158" r="15" fill="#fbbf24" opacity="0.22"/>
    <circle cx="910" cy="244" r="4" fill="#38bdf8"/><circle cx="910" cy="244" r="11" fill="#38bdf8" opacity="0.2"/>
  </g>
</svg>
