<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Floating offshore wind turbines and tidal energy arrays in the North Sea">
  <defs>
    <linearGradient id="northSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071525"/>
      <stop offset="52%" stop-color="#0f344c"/>
      <stop offset="82%" stop-color="#387780"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="seaWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d4f5c"/>
      <stop offset="45%" stop-color="#082f40"/>
      <stop offset="100%" stop-color="#03111c"/>
    </linearGradient>
    <radialGradient id="sunBreak" cx="72%" cy="56%" r="36%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tidalGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="410" fill="url(#northSky)"/>
  <ellipse cx="860" cy="375" rx="340" ry="150" fill="url(#sunBreak)"/>
  <!-- Dramatic clouds -->
  <path d="M0 170 Q180 120 390 165 T820 148 T1200 180 L1200 0 L0 0 Z" fill="#061221" opacity="0.45"/>
  <!-- Deep North Sea -->
  <rect y="405" width="1200" height="270" fill="url(#seaWater)"/>
  <!-- Subsea HVDC energy grid lines glowing beneath waves -->
  <g fill="none" stroke="url(#tidalGlow)" stroke-width="2.5">
    <path d="M60 560 Q320 510 560 545 T1140 530"/>
    <path d="M120 615 Q440 570 760 605 T1160 590" stroke-dasharray="10 8" opacity="0.7"/>
  </g>
  <!-- Water horizon shimmer -->
  <g stroke="#fde68a" stroke-linecap="round" opacity="0.35">
    <line x1="650" y1="422" x2="1040" y2="422" stroke-width="2.2"/>
    <line x1="710" y1="442" x2="980" y2="442" stroke-width="1.6"/>
    <line x1="760" y1="466" x2="930" y2="466" stroke-width="1.2"/>
  </g>
  <!-- Background Offshore Turbine 1 -->
  <g transform="translate(220, 412) scale(0.58)" opacity="0.75">
    <rect x="-26" y="-8" width="52" height="14" rx="4" fill="#f59e0b"/>
    <path d="M-5 -8 L-2 -230 L2 -230 L5 -8 Z" fill="#cbd5e1"/>
    <g transform="translate(0, -230)">
      <path d="M0 0 L-7 -128 L4 -128 Z" fill="#f8fafc"/>
      <path d="M0 0 L112 64 L106 74 Z" fill="#e2e8f0"/>
      <path d="M0 0 L-108 68 L-114 58 Z" fill="#cbd5e1"/>
      <circle r="7" fill="#0f172a"/>
    </g>
  </g>
  <!-- Midground Offshore Turbine 2 -->
  <g transform="translate(880, 422) scale(0.78)" opacity="0.9">
    <rect x="-32" y="-10" width="64" height="16" rx="5" fill="#f59e0b"/>
    <path d="M-6 -10 L-2.5 -245 L2.5 -245 L6 -10 Z" fill="#e2e8f0"/>
    <g transform="translate(0, -245) rotate(24)">
      <path d="M0 0 L-8 -142 L5 -142 Z" fill="#ffffff"/>
      <path d="M0 0 L125 70 L118 82 Z" fill="#e2e8f0"/>
      <path d="M0 0 L-120 74 L-127 62 Z" fill="#cbd5e1"/>
      <circle r="8" fill="#0f172a"/>
    </g>
  </g>
  <!-- Hero Foreground Floating Tension-Leg Wind Turbine -->
  <g transform="translate(500, 456)">
    <!-- Submerged tension-leg base visible through clear teal water -->
    <polygon points="-76,12 76,12 48,88 -48,88" fill="#10b981" fill-opacity="0.16" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 4"/>
    <!-- Bright safety-amber floating semi-submersible platform -->
    <rect x="-56" y="-14" width="112" height="22" rx="6" fill="#f59e0b"/>
    <rect x="-46" y="-22" width="18" height="14" rx="2" fill="#fbbf24"/>
    <rect x="28" y="-22" width="18" height="14" rx="2" fill="#fbbf24"/>
    <!-- Tower -->
    <path d="M-9 -14 L-3.5 -292 L3.5 -292 L9 -14 Z" fill="#f8fafc"/>
    <!-- Rotor & Swept Air Circle -->
    <g transform="translate(0, -292)">
      <circle r="158" fill="none" stroke="#7dd3fc" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 8"/>
      <g transform="rotate(-18)">
        <path d="M0 0 L-9 -160 L6 -160 Z" fill="#ffffff"/>
        <path d="M0 0 L142 78 L134 92 Z" fill="#e2e8f0"/>
        <path d="M0 0 L-136 84 L-144 70 Z" fill="#cbd5e1"/>
        <circle r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      </g>
    </g>
  </g>
  <!-- Subtle wave ripples -->
  <g stroke="#34d399" stroke-opacity="0.26" fill="none" stroke-width="1.6">
    <path d="M0 495 Q160 482 320 495 T640 495 T960 495 T1200 495"/>
    <path d="M0 548 Q200 536 400 548 T800 548 T1200 548" stroke-opacity="0.2"/>
  </g>
</svg>
