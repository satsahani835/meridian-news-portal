<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Silicon photonics semiconductor wafer glowing with laser waveguides">
  <defs>
    <radialGradient id="cleanroom" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#090d1e"/>
      <stop offset="100%" stop-color="#03050c"/>
    </radialGradient>
    <linearGradient id="waferSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="32%" stop-color="#a855f7"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fde68a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="waferClip">
      <ellipse cx="600" cy="365" rx="430" ry="230"/>
    </clipPath>
    <filter id="blurLaser"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#cleanroom)"/>
  <!-- Outer ambient halo -->
  <ellipse cx="600" cy="365" rx="455" ry="248" fill="url(#waferSheen)" opacity="0.16" filter="url(#blurLaser)"/>
  <!-- 300mm Silicon Wafer Rim -->
  <ellipse cx="600" cy="374" rx="434" ry="232" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="600" cy="365" rx="430" ry="230" fill="#0b1224" stroke="url(#waferSheen)" stroke-width="3"/>
  <!-- Lithography Die Grid inside Wafer -->
  <g clip-path="url(#waferClip)">
    <rect x="170" y="135" width="860" height="460" fill="url(#waferSheen)" opacity="0.22"/>
    <g stroke="#94a3b8" stroke-opacity="0.34" stroke-width="1.2">
      <line x1="250" y1="135" x2="250" y2="595"/><line x1="330" y1="135" x2="330" y2="595"/>
      <line x1="410" y1="135" x2="410" y2="595"/><line x1="490" y1="135" x2="490" y2="595"/>
      <line x1="570" y1="135" x2="570" y2="595"/><line x1="650" y1="135" x2="650" y2="595"/>
      <line x1="730" y1="135" x2="730" y2="595"/><line x1="810" y1="135" x2="810" y2="595"/>
      <line x1="890" y1="135" x2="890" y2="595"/><line x1="970" y1="135" x2="970" y2="595"/>
      <line x1="170" y1="205" x2="1030" y2="205"/><line x1="170" y1="265" x2="1030" y2="265"/>
      <line x1="170" y1="325" x2="1030" y2="325"/><line x1="170" y1="385" x2="1030" y2="385"/>
      <line x1="170" y1="445" x2="1030" y2="445"/><line x1="170" y1="505" x2="1030" y2="505"/>
    </g>
    <!-- Highlighted Photonic Processor Dies -->
    <g fill="#0f172a" fill-opacity="0.72" stroke="#38bdf8" stroke-width="1.5">
      <rect x="494" y="269" width="72" height="52" rx="4"/>
      <rect x="574" y="269" width="72" height="52" rx="4" stroke="#f59e0b"/>
      <rect x="654" y="269" width="72" height="52" rx="4"/>
      <rect x="494" y="329" width="72" height="52" rx="4" stroke="#a855f7"/>
      <rect x="574" y="329" width="72" height="52" rx="4" stroke="#fde68a" stroke-width="2.2"/>
      <rect x="654" y="329" width="72" height="52" rx="4" stroke="#10b981"/>
      <rect x="494" y="389" width="72" height="52" rx="4"/>
      <rect x="574" y="389" width="72" height="52" rx="4" stroke="#38bdf8"/>
      <rect x="654" y="389" width="72" height="52" rx="4"/>
    </g>
    <!-- Optical Waveguide Pulses -->
    <g stroke="url(#laserBeam)" stroke-width="3" fill="none">
      <path d="M180 355 L490 355 L520 325 L690 325 L720 355 L1020 355"/>
      <path d="M180 385 L450 385 L490 415 L730 415 L770 385 L1020 385" stroke-width="2"/>
    </g>
    <g stroke="url(#laserBeam)" stroke-width="8" fill="none" opacity="0.35" filter="url(#blurLaser)">
      <path d="M180 355 L490 355 L520 325 L690 325 L720 355 L1020 355"/>
    </g>
  </g>
  <!-- Glowing Photonic Nodes -->
  <circle cx="610" cy="355" r="8" fill="#fef3c7"/>
  <circle cx="610" cy="355" r="24" fill="#f59e0b" opacity="0.28"/>
  <circle cx="530" cy="295" r="5" fill="#38bdf8"/>
  <circle cx="690" cy="415" r="5" fill="#10b981"/>
</svg>
